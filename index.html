<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notre mariage ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #faf7f2;
      font-family: Georgia, serif;
      color: #333;
      text-align: center;
    }

    .box {
      background: white;
      padding: 45px 30px;
      max-width: 500px;
      margin: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-weight: normal;
      margin-bottom: 10px;
    }

    p {
      color: #777;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 14px 28px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Notre mariage ❤️</h1>

    <p>Revivez ce moment en vidéo</p>

    <a href="https://photos.app.goo.gl/Fp2d5ek45LjJN2827" target="_blank">
      ▶ Voir la vidéo
    </a>
  </div>

</body>
</html>
